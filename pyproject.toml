[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codetui"
version = "0.1.0"
description = "Simple TUI Coding Agent"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "textual>=0.44.0",
    "mcp>=1.0",
]

[project.scripts]
codetui = "codetui.main:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.24.0",
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
